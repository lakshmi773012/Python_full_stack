<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>

        /* DEFAULT */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            transition:
                background-color 0.3s ease,
                color 0.3s ease;
        }


        /* LIGHT MODE */

        body.light {
            background-color: #eef3f8;
            color: #1f2937;
        }

        body.light .content {
            background-color: #ffffff;
            color: #1f2937;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body.light .content h1 {
            color: #172554;
        }

        body.light .content p {
            color: #64748b;
        }


        /* DARK MODE */

        body.dark {
            background-color: #0f172a;
            color: white;
        }

        body.dark .content {
            background-color: #1e293b;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        body.dark .content h1 {
            color: white;
        }

        body.dark .content p {
            color: #cbd5e1;
        }


        /* NAVBAR */

        .navbar {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);

            padding: 18px 35px;

            display: flex;

            align-items: center;

            min-height: 75px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.18);
        }


        /* LOGO */

        .logo {
            color: white;

            font-size: 23px;

            font-weight: bold;

            margin-right: auto;

            letter-spacing: 0.3px;
        }


        /* THEME BUTTONS */

        .theme-buttons {
            display: flex;

            gap: 8px;

            margin-right: 30px;
        }

        .theme-buttons a {
            color: white;

            text-decoration: none;

            border: 1px solid rgba(255, 255, 255, 0.6);

            padding: 8px 13px;

            border-radius: 20px;

            font-size: 13px;

            transition: 0.3s;

            background-color: rgba(255, 255, 255, 0.08);
        }

        .theme-buttons a:hover {
            background-color: white;

            color: #1e3a8a;

            transform: translateY(-2px);
        }


        /* NAV LINKS */

        .nav-links {
            display: flex;

            align-items: center;

            list-style: none;

            gap: 24px;
        }

        .nav-links a {
            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: 500;

            transition: 0.3s;

            position: relative;
        }

        .nav-links a:not(.logout-button)::after {
            content: "";

            position: absolute;

            left: 0;

            bottom: -6px;

            width: 0;

            height: 2px;

            background-color: #38bdf8;

            transition: 0.3s;
        }

        .nav-links a:not(.logout-button):hover {
            color: #38bdf8;
        }

        .nav-links a:not(.logout-button):hover::after {
            width: 100%;
        }


        /* LOGOUT BUTTON */

        .logout-button {
            background: linear-gradient(135deg, #ef4444, #dc2626);

            color: white !important;

            padding: 9px 16px;

            border-radius: 6px;

            text-decoration: none;

            font-size: 14px !important;

            font-weight: bold;

            transition: 0.3s;

            box-shadow: 0 3px 8px rgba(220, 38, 38, 0.3);
        }

        .logout-button:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);

            color: white !important;

            transform: translateY(-2px);

            box-shadow: 0 5px 12px rgba(220, 38, 38, 0.4);
        }


        /* CONTENT */

        .content {
            width: 82%;

            max-width: 1000px;

            margin: 70px auto;

            padding: 75px 40px;

            border-radius: 18px;

            text-align: center;

            transition: 0.3s;

            border: 1px solid rgba(148, 163, 184, 0.15);
        }

        .content h1 {
            margin-bottom: 18px;

            font-size: 34px;

            font-weight: 700;

            letter-spacing: 0.3px;
        }

        .content p {
            font-size: 18px;

            line-height: 1.6;
        }


        /* MOBILE */

        @media (max-width: 900px) {

            .navbar {
                flex-wrap: wrap;

                gap: 15px;

                padding: 18px;
            }

            .logo {
                width: 100%;

                margin-right: 0;

                text-align: center;
            }

            .theme-buttons {
                margin-right: 0;

                width: 100%;

                justify-content: center;
            }

            .nav-links {
                flex-wrap: wrap;

                justify-content: center;

                width: 100%;

                gap: 15px;
            }

            .content {
                width: 90%;

                margin: 45px auto;

                padding: 55px 20px;
            }

            .content h1 {
                font-size: 27px;
            }

            .content p {
                font-size: 16px;
            }

        }

    </style>

</head>


<!-- Flask sends theme = light/dark -->

<body class="{{ theme }}">


    <!-- NAVBAR -->

    <nav class="navbar">


        <!-- LOGO -->

        <div class="logo">
            Employee Management System
        </div>


        <!-- THEME BUTTONS -->

        <div class="theme-buttons">

            <a href="/set-theme/light">☀ Light</a>

            <a href="/set-theme/dark">🌙 Dark </a>

        </div>


        <!-- NAVIGATION -->

        <ul class="nav-links">

            <li>
                <a href="/">Home</a>
            </li>

            <li>
                <a href="/employees">Employees</a>
            </li>

            <li>
                <a href="/add-employee"> Add Employee</a>
            </li>

            <li>
                <a href="/search">Search </a>
            </li>


            <!-- LOGOUT -->

            <li>
                <a href="/logout" class="logout-button">Logout </a>
            </li>

        </ul>

    </nav>


    <!-- CONTENT -->

    <div class="content">

        {% if fullname %}

            <h1>Welcome, {{ fullname }}!</h1>

        {% else %}

            <h1>Welcome to Employee Management System </h1>

        {% endif %}


        <p> Manage your employees easily. </p>

    </div>


</body>

</html>
