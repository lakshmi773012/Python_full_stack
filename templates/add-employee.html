<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }

        .buttons {
            text-align: center;
            margin-top: 10px;
        }

        .add-btn,
        .reset-btn {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .add-btn {
            background-color: #28a745;
            color: white;
        }

        .reset-btn {
            background-color: #6c757d;
            color: white;
        }

        .address {
            margin-top: 5px;
        }

        @media (max-width: 700px) {
            .row {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Add Employee</h1>

        <form action="/add-employee" method="POST">

            <!-- Name and Email -->
            <div class="row">

                <div class="form-group">
                    <label for="name">Employee Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter employee name" required>
                </div>

                <div class="form-group">
                    <label for="email">Employee Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter employee email" required>
                </div>

            </div>

            <!-- Phone and Department -->
            <div class="row">

                <div class="form-group">
                    <label for="phone">Employee Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter employee phone" required>
                </div>

                <div class="form-group">
                    <label for="department">Employee Department</label>
                    <select id="department" name="department" required>
                        <option value="">Select Department</option>
                        <option value="HR">HR</option>
                        <option value="IT">IT</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>
                    </select>
                </div>

            </div>

            <!-- Salary and Join Date -->
            <div class="row">

                <div class="form-group">
                    <label for="salary">Employee Salary</label>
                    <input type="number" id="salary" name="salary" placeholder="Enter employee salary" required>
                </div>

                <div class="form-group">
                    <label for="join_date">Employee Join Date</label>
                    <input type="date" id="join_date" name="join_date" required>
                </div>

            </div>

            <!-- Address -->
            <div class="form-group address">
                <label for="address">Employee Address</label>
                <input type="text" id="address" name="address" placeholder="Enter employee address" required>
            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button type="submit" class="add-btn">
                    Add Employee
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>

            </div>

        </form>

    </div>

</body>
</html>
