        <!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body>

<h2>Registration Form</h2>

<form id="myForm">

    <label>Full Name:</label>
    <input type="text" id="fullname">
    <br><br>
    <label>User Name:</label>
    <input type="text" id="username">
    <br><br>

    <label>Phone No:</label>
    <select id="code">
        <option>+91 India</option>
        <option>+1 USA</option>
        <option>+44 UK</option>
        <option>+61 Australia</option>
    </select>
    <input type="tel" id="phone">
    <br><br>

    <label>Email:</label>
    <input type="email" id="email">
    <br><br>

    <label>Password:</label>
    <input type="password" id="password">
    <br><br>

    <label>Confirm Password:</label>
    <input type="password" id="confirmPassword">
    <br><br>

    <label>DOB:</label>
    <input type="date" id="dob">
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <br><br>

    <label>Hobbies:</label>
    <input type="checkbox" name="hobby" value="Reading"> Reading
    <input type="checkbox" name="hobby" value="Music"> Music
    <input type="checkbox" name="hobby" value="Sports"> Sports
    <input type="checkbox" name="hobby" value="Coding"> Coding
    <br><br>

    <label>Address:</label>
    <br><br>

    <label>City:</label>
    <input type="text" id="city">
    <br><br>

    <label>State:</label>
    <select id="state">
        <option>Select State</option>
        <option>Telangana</option>
        <option>Andhra Pradesh</option>
        <option>Karnataka</option>
        <option>Tamil Nadu</option>
        <option>Kerala</option>
    </select>
    <br><br>

    <label>Country:</label>
    <select id="country">
        <option>Select Country</option>
        <option>India</option>
        <option>USA</option>
        <option>UK</option>
        <option>Australia</option>
        <option>Canada</option>
    </select>
    <br><br>

    <label>Profile Picture:</label>
    <input type="file" id="profilePic">
    <br><br>

    <input type="checkbox" id="terms">
    <label>I agree to Terms and Conditions</label>
    <br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

</form>

<script>

document.getElementById("myForm").addEventListener("submit", function(event){
event.preventDefault()/*preventDefault function of event that excute submit event happened (even is like a object)(console lo data display ki use avutundhi)*/

// let fullname=(document.getElementById("fullname").value)
// console.log(fullname)

    console.log("Full Name:", document.getElementById("fullname").value);
    console.log("User Name:", document.getElementById("username").value);
    console.log("Phone Code:", document.getElementById("code").value);
    console.log("Phone No:", document.getElementById("phone").value);
    console.log("Email:", document.getElementById("email").value);
    console.log("Password:", document.getElementById("password").value);
    console.log("Confirm Password:", document.getElementById("confirmPassword").value);
    console.log("DOB:", document.getElementById("dob").value);

    let gender = document.querySelector('input[name="gender"]:checked');
    console.log("Gender:", gender ? gender.value : "");

    let hobbies = document.querySelectorAll('input[name="hobby"]:checked');
    let list = [];

    hobbies.forEach(function(hobby) {
        list.push(hobby.value);
    });

    console.log("Hobbies:", list);
    console.log("City:", document.getElementById("city").value);
    console.log("State:", document.getElementById("state").value);
    console.log("Country:", document.getElementById("country").value);

    let file = document.getElementById("profilePic").files[0];
    console.log("Profile Picture:", file ? file.name : "No file");

    console.log("Terms Accepted:",
        document.getElementById("terms").checked);

});

</script>

</body>
</html>
